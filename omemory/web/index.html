<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Memory</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#0f1115;color:#eee}header{padding:22px 28px;border-bottom:1px solid #292d35;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 75px)}aside{padding:22px;border-right:1px solid #292d35}section{padding:22px}.card{background:#171a21;border:1px solid #292d35;border-radius:12px;padding:16px;margin-bottom:12px}.muted{color:#9299a6}input,textarea,select,button{font:inherit;background:#11141a;color:#eee;border:1px solid #343946;border-radius:8px;padding:9px}input{width:60%}button{cursor:pointer}.row{display:flex;gap:8px;margin-bottom:16px}.item{cursor:pointer}.item:hover{border-color:#667085}.pill{display:inline-block;padding:3px 7px;border:1px solid #343946;border-radius:99px;font-size:12px}</style></head><body><header><b>🧠 Owner Memory</b><span class="muted">file-first • local • editable</span></header><main><aside><div class="card"><b>Overview</b><div id="stats" class="muted">Loading…</div></div><div class="card"><b>Memory</b><p><button onclick="load()">All</button></p><p><button onclick="load('knowledge')">Knowledge</button></p><p><button onclick="load('experience')">Experience</button></p><p><button onclick="load('decision')">Decisions</button></p><p><button onclick="load('workflow')">Workflows</button></p><p><button onclick="load('project-state')">Project State</button></p></div><div class="card"><button onclick="doctor()">Run Memory Doctor</button></div></aside><section><div class="row"><input id="q" placeholder="Search memory…" onkeydown="if(event.key==='Enter')load()"><button onclick="load()">Search</button><button onclick="newMemory()">+ New</button></div><div id="list"></div></section></main><script>
async function api(p,o){let r=await fetch('/api'+p,o);return r.json()}async function refreshStats(){let s=await api('/stats');document.getElementById('stats').innerHTML='<h2>'+s.total+'</h2>'+Object.entries(s.by_type).map(([k,v])=>k+': '+v+'<br>').join('')+'<br>Projects: '+s.projects.length}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(kind){let q=document.getElementById('q').value,p='?limit=100';if(q)p+='&q='+encodeURIComponent(q);if(kind)p+='&kind='+encodeURIComponent(kind);let d=await api('/memories'+p),items=d.items||[];document.getElementById('list').innerHTML=items.map(x=>'<div class="card item" onclick="edit(\''+x.id+'\')"><span class="pill">'+esc(x.type)+'</span> <b>'+esc(x.title)+'</b><p>'+esc(x.content).slice(0,500)+'</p><span class="muted">'+esc(x.id)+' • confidence '+x.confidence+'</span></div>').join('')||'<div class="card muted">No memories found.</div>';refreshStats()}async function edit(id){let x=await api('/memories/'+id),content=prompt('Edit content:',x.content);if(content===null)return;await api('/memories/'+id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({content})});load()}async function newMemory(){let title=prompt('Title');if(!title)return;let content=prompt('Content');if(!content)return;await api('/memories',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kind:'knowledge',title,content})});load()}async function doctor(){let d=await api('/doctor');alert(JSON.stringify(d,null,2))}load();</script></body></html>
