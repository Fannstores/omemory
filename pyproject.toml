[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omemory"
version = "0.1.0"
description = "Local-first persistent memory for AI agents, with file storage, Web UI, REST API, and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "starlette>=0.37",
  "uvicorn>=0.30",
  "mcp>=1.20"
]

[project.scripts]
omemory = "omemory.cli:main"

[tool.setuptools.packages.find]
include = ["omemory*"]
